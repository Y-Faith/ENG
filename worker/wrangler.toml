name = "call-english-worker"
main = "src/index.ts"
compatibility_date = "2025-05-12"

[[d1_databases]]
binding = "DB"
database_name = "call-english-db"
database_id = ""

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = ""

[env.production.vars]
AI_API_KEY = ""
AI_API_URL = "https://api.chatanywhere.tech/v1"
AI_MODEL = "deepseek-chat"
DAILY_LIMIT = "100"

[env.production.routes]
pattern = "api/*"
zone_id = ""

[dev]
port = 8787