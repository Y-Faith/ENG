<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEU-ENG - AI英语陪练</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; }
      body {
        background: white !important;
        color-scheme: light !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .wechat-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        padding: 24px;
      }
      .wechat-logo {
        font-size: 32px;
        font-weight: bold;
        color: #4CAF50;
        margin-bottom: 32px;
      }
      .wechat-icon {
        width: 120px;
        height: 120px;
        margin-bottom: 32px;
        position: relative;
      }
      .wechat-arrow {
        position: absolute;
        top: -10px;
        right: -20px;
        width: 60px;
        height: 60px;
        animation: bounce 1s infinite;
      }
      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
      }
      .wechat-text {
        font-size: 18px;
        text-align: center;
        color: #333;
        margin-bottom: 12px;
      }
      .wechat-hint {
        font-size: 14px;
        text-align: center;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var isWeChat = /micromessenger/i.test(navigator.userAgent);
        if (isWeChat) {
          var overlay = document.createElement('div');
          overlay.className = 'wechat-overlay';
          overlay.innerHTML = `
            <div class="wechat-logo">SEU-ENG</div>
            <div class="wechat-icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="2" y="3" width="20" height="18" rx="2" ry="2" stroke="#4CAF50" stroke-width="2"/>
                <circle cx="8" cy="12" r="1.5" fill="#4CAF50"/>
                <circle cx="16" cy="12" r="1.5" fill="#4CAF50"/>
                <path d="M8 17C9.5 16.5 14.5 16.5 16 17" stroke="#4CAF50" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <svg class="wechat-arrow" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 4L9 15M20 4L12 2L20 4ZM20 4L22 12" stroke="#4CAF50" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <div class="wechat-text">请在浏览器中打开</div>
            <div class="wechat-hint">点击右上角 ···，选择“在浏览器中打开”</div>
          `;
          document.body.innerHTML = '';
          document.body.appendChild(overlay);
        } else {
          var script = document.createElement('script');
          script.type = 'module';
          script.src = '/src/main.tsx';
          document.body.appendChild(script);
        }
      })();
    </script>
  </body>
</html>
